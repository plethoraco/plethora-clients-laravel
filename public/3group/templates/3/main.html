<link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&family=Newsreader:ital,opsz@0,6..72;1,6..72&display=swap" rel="stylesheet">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;">
  <tr>
    <td style="padding:0; vertical-align:middle;">
      <img src="{imageUrl}/logo-b3-interiors.png" width="81" alt="B3 Interiors" style="display:block; border:0; outline:none; text-decoration:none; width:81px; max-width:81px; height:auto;" />
    </td>
    <td width="20" style="width:20px; font-size:0; line-height:0;">&nbsp;</td>
    <td width="1" style="width:1px; background-color:#EE7A40; font-size:0; line-height:0;">&nbsp;</td>
    <td width="20" style="width:20px; font-size:0; line-height:0;">&nbsp;</td>
    <td style="padding:0; vertical-align:top; color:#1C1919;">
      <div style="font-family:'Newsreader', Georgia, 'Times New Roman', serif; font-size:16px; line-height:20px; font-weight:400; mso-line-height-rule:exactly; color:#1C1919;">{name}</div>
      <div style="font-family:'Newsreader', Georgia, 'Times New Roman', serif; font-size:12px; line-height:18px; font-style:italic; font-weight:400; mso-line-height-rule:exactly; color:#EE7A40;">{title}</div>
      <div style="height:8px; line-height:8px; font-size:1px;">&nbsp;</div>
      <div style="font-family:'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:17px; font-weight:300; mso-line-height-rule:exactly; color:#1C1919;">
        <a href="mailto:{email}" style="color:#1C1919; text-decoration:none;">{email}</a>
      </div>
      <div style="font-family:'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:17px; font-weight:300; mso-line-height-rule:exactly; color:#1C1919;">
        <a href="tel:{phone}" style="color:#1C1919; text-decoration:none;">{phone}</a>
      </div>
      <ddiBlock>
        <div style="font-family:'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:17px; font-weight:300; mso-line-height-rule:exactly; color:#1C1919;">
          <a href="tel:{ddi}" style="color:#1C1919; text-decoration:none;">{ddi}</a>
        </div>
      </ddiBlock>
      <div style="height:8px; line-height:8px; font-size:1px;">&nbsp;</div>
      <div style="font-family:'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size:11px; line-height:17px; font-weight:300; mso-line-height-rule:exactly; color:#1C1919;">
        <a href="https://b3interiors.co.nz" style="color:#1C1919; text-decoration:underline;">b3interiors.co.nz</a>
      </div>
    </td>
  </tr>
</table>
